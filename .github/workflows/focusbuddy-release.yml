name: FocusBuddy Release

on:
  push:
    tags:
      - 'focusbuddy-v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      FOCUSBUDDY_API_URL: ${{ vars.FOCUSBUDDY_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate the production tag and public Konea API URL
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath 'apps/focusbuddy/package.json' -Raw | ConvertFrom-Json
          $expectedTag = "focusbuddy-v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match package version '$expectedTag'."
          }

          $candidate = $env:FOCUSBUDDY_API_URL
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            throw 'Repository variable FOCUSBUDDY_API_URL is required for a public FocusBuddy release.'
          }

          $parsed = $null
          if (-not [Uri]::TryCreate($candidate, [UriKind]::Absolute, [ref]$parsed)) {
            throw 'FOCUSBUDDY_API_URL must be an absolute URL.'
          }
          if ($parsed.Scheme -ne 'https' -or [string]::IsNullOrWhiteSpace($parsed.Host)) {
            throw 'FOCUSBUDDY_API_URL must use HTTPS and include a host.'
          }
          $hostName = $parsed.DnsSafeHost.TrimEnd('.').ToLowerInvariant()
          if ($parsed.IsLoopback -or $hostName -eq '0.0.0.0' -or $hostName -eq '::' -or $hostName.EndsWith('.localhost') -or $hostName.EndsWith('.local')) {
            throw 'A production FocusBuddy release must not target a local API.'
          }
          if (-not [string]::IsNullOrEmpty($parsed.UserInfo)) {
            throw 'FOCUSBUDDY_API_URL must not contain embedded credentials.'
          }
          if (-not [string]::IsNullOrEmpty($parsed.Query) -or -not [string]::IsNullOrEmpty($parsed.Fragment)) {
            throw 'FOCUSBUDDY_API_URL must not contain a query string or fragment.'
          }
          $apiPath = $parsed.AbsolutePath.TrimEnd('/')
          if (-not $apiPath.EndsWith('/api/v1', [StringComparison]::Ordinal)) {
            throw 'FOCUSBUDDY_API_URL must end with /api/v1.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Test FocusBuddy
        run: npm run test --workspace @konea/focusbuddy

      - name: Validate FocusBuddy sources
        run: npm run build --workspace @konea/focusbuddy

      - name: Build and verify the production NSIS installer
        run: npm run dist:production --workspace @konea/focusbuddy

      - name: Verify the packaged production channel and installer
        run: npm run verify:release --workspace @konea/focusbuddy -- --channel=production --require-installer

      - name: Prepare stable release assets
        id: assets
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath 'apps/focusbuddy/package.json' -Raw | ConvertFrom-Json
          $releaseDirectory = Join-Path $PWD 'apps/focusbuddy/release/production'
          $sourceInstaller = Join-Path $releaseDirectory "Konea-FocusBuddy-$($package.version)-x64.exe"
          if (-not (Test-Path -LiteralPath $sourceInstaller -PathType Leaf)) {
            throw 'electron-builder did not produce the expected production Windows x64 installer.'
          }

          $stableInstaller = Join-Path $releaseDirectory 'Konea-FocusBuddy-Windows-x64.exe'
          $checksumFile = "$stableInstaller.sha256"
          Copy-Item -LiteralPath $sourceInstaller -Destination $stableInstaller -Force
          $checksum = (Get-FileHash -LiteralPath $stableInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumFile -Value "$checksum  Konea-FocusBuddy-Windows-x64.exe" -Encoding ascii

          "installer=$stableInstaller" >> $env:GITHUB_OUTPUT
          "checksum=$checksumFile" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = '${{ steps.assets.outputs.installer }}'
          $checksum = '${{ steps.assets.outputs.checksum }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $checksum --generate-notes --title "Konea FocusBuddy $tag" --repo $env:GITHUB_REPOSITORY
          }
