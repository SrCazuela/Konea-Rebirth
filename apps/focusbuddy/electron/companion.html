<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compañero FocusBuddy</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/branding/konea-mark.svg"
    />
    <link rel="stylesheet" href="companion.css" />
  </head>
  <body>
    <main
      class="companion"
      data-status="idle"
      aria-label="Compañero FocusBuddy"
    >
      <section class="bubble" aria-live="polite" aria-atomic="true">
        <strong id="session-title">Listo para estudiar</strong>
        <span id="session-course" hidden></span>
        <time id="session-timer">--:--</time>
      </section>

      <div
        class="avatar-button drag-region"
        aria-hidden="true"
        title="Arrastra para mover el compañero"
      >
        <span
          class="avatar-portrait"
          id="companion-avatar"
          data-character="chibi"
          data-frame="0"
          data-mood="idle"
          role="img"
          aria-label="FocusBuddy está listo para estudiar"
        >
          <span class="avatar-kuco" aria-hidden="true"></span>
          <span class="avatar-chibi">
            <img
              class="avatar-chibi__image"
              id="companion-chibi"
              src="assets/avatar-hq/idle-1.png"
              alt=""
              draggable="false"
          /></span>
        </span>
      </div>

      <nav class="companion-actions" aria-label="Acciones del compañero">
        <button id="open-button" type="button" title="Abrir FocusBuddy">
          Abrir
        </button>
        <button
          id="compact-button"
          type="button"
          title="Alternar ventana compacta"
        >
          Mini
        </button>
        <button id="hide-button" type="button" title="Ocultar compañero">
          Ocultar
        </button>
      </nav>
    </main>
    <script src="avatar-library.js"></script>
    <script src="avatar-animation.js"></script>
    <script src="motion-policy.js"></script>
    <script src="companion.js"></script>
  </body>
</html>
