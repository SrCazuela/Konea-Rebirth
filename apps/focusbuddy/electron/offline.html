<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusBuddy sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #211638;
        background: radial-gradient(circle at top, #f0e7ff, #faf8ff 55%);
      }
      main {
        width: min(90vw, 540px);
        padding: 48px;
        text-align: center;
        background: #fff;
        border: 1px solid #e4d9f3;
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(72, 35, 125, 0.13);
      }
      .avatar {
        width: 112px;
        height: 112px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        color: #fff;
        font-size: 52px;
        background: linear-gradient(145deg, #9258e8, #6130bd);
        animation: float 2.6s ease-in-out infinite;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 28px;
        line-height: 1.6;
        color: #695c7c;
      }
      button {
        border: 0;
        border-radius: 14px;
        padding: 13px 22px;
        color: #fff;
        background: #7138ca;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #5e2caf;
      }
      @keyframes float {
        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .avatar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="avatar" aria-hidden="true">✦</div>
      <h1>FocusBuddy no encuentra Konea</h1>
      <p>
        Inicia el entorno con <strong>iniciar.bat</strong> y vuelve a
        intentarlo. En producción, el cliente usará la dirección web
        configurada.
      </p>
      <button id="retry" type="button">Reintentar conexión</button>
    </main>
    <script src="./offline.js"></script>
  </body>
</html>
