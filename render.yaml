# Only the API is deployed here. Sites hosts the frontend; PostgreSQL and a
# PRIVATE object-storage bucket live in Neon. No paid database/disk is created.
services:
  - type: web
    name: konea-capstone-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: UPLOAD_STORAGE
        value: s3
      - key: S3_REGION
        value: us-east-2
      - key: DUCO_AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SITES_BACKEND_TOKEN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
